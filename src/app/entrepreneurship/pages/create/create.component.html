<div class="create-form">
  <div class="create-form__section">
    <h3 class="create-form__section-title">Información del Emprendimiento</h3>
    <div class="create-form__grid">
      <div class="create-form__field create-form__field--full" [class.create-form__field--error]="submitted() && !form().name">
        <label class="create-form__label">Nombre *</label>
        <input class="create-form__input" [class.create-form__input--error]="submitted() && !form().name" [(ngModel)]="form().name" (ngModelChange)="form.update(f => ({...f, name: $event}))" placeholder="Ej: Mi Emprendimiento Tech" />
        <span class="create-form__error" *ngIf="submitted() && !form().name">El nombre es obligatorio</span>
      </div>
      <div class="create-form__field create-form__field--full" [class.create-form__field--error]="submitted() && !form().description">
        <label class="create-form__label">Descripción *</label>
        <textarea class="create-form__textarea" [class.create-form__textarea--error]="submitted() && !form().description" [(ngModel)]="form().description" (ngModelChange)="form.update(f => ({...f, description: $event}))" rows="3" placeholder="Describe tu emprendimiento..."></textarea>
        <span class="create-form__error" *ngIf="submitted() && !form().description">La descripción es obligatoria</span>
      </div>
      <div class="create-form__field" [class.create-form__field--error]="submitted() && !form().categoryId">
        <label class="create-form__label">Categoría *</label>
        <select class="create-form__select" [class.create-form__select--error]="submitted() && !form().categoryId" [(ngModel)]="form().categoryId" (ngModelChange)="form.update(f => ({...f, categoryId: $event}))">
          <option [ngValue]="null">Seleccionar...</option>
          <option *ngFor="let cat of categories()" [ngValue]="cat.categoryId">{{ cat.name }}</option>
        </select>
        <span class="create-form__error" *ngIf="submitted() && !form().categoryId">La categoría es obligatoria</span>
      </div>
      <div class="create-form__field">
        <label class="create-form__label">Tipo</label>
        <div class="create-form__radio-group">
          <label class="create-form__radio">
            <input type="radio" name="type" [checked]="form().isPhysical && !form().isDigital" (change)="form.update(f => ({...f, isPhysical: true, isDigital: false}))" />
            Físico
          </label>
          <label class="create-form__radio">
            <input type="radio" name="type" [checked]="!form().isPhysical && form().isDigital" (change)="form.update(f => ({...f, isPhysical: false, isDigital: true}))" />
            Digital
          </label>
          <label class="create-form__radio">
            <input type="radio" name="type" [checked]="!form().isPhysical && !form().isDigital" (change)="form.update(f => ({...f, isPhysical: false, isDigital: false}))" />
            Ambos
          </label>
        </div>
      </div>
    </div>
  </div>

  <div class="create-form__section">
    <h3 class="create-form__section-title">Logo (Opcional)</h3>
    <div class="create-form__logo">
      <div class="create-form__logo-preview" *ngIf="logoPreview()">
        <img [src]="logoPreview()" alt="Logo preview" />
        <button class="create-form__logo-remove" (click)="removeLogo()"><i class="pi pi-times"></i></button>
      </div>
      <div class="create-form__logo-upload" *ngIf="!logoPreview()" (click)="logoInput.click()">
        <i class="pi pi-image"></i>
        <span>Seleccionar logo</span>
      </div>
      <input #logoInput type="file" accept="image/*" (change)="onLogoSelected($event)" style="display: none" />
    </div>
  </div>

  <div class="create-form__actions">
    <button class="btn btn--ghost" (click)="cancel()" [disabled]="loading()">Cancelar</button>
    <button class="btn btn--primary" (click)="onSubmit()" [disabled]="loading() || !form().name || !form().description || !form().categoryId">
      <i class="pi pi-spin pi-spinner" *ngIf="loading()"></i>
      {{ loading() ? 'Creando...' : 'Crear Emprendimiento' }}
    </button>
  </div>
</div>
